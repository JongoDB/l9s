name: Dependencies

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Re-resolve to the newest allowed versions
        run: |
          cp requirements.lock /tmp/old.lock
          uv pip compile --universal --python-version 3.12 --upgrade -q requirements.in -o requirements.lock
      - id: diff
        run: |
          python3 .github/scripts/lockdiff.py /tmp/old.lock requirements.lock requirements.in | tee changes.txt
          if [ -s changes.txt ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-lock
          path: |
            requirements.lock
            changes.txt

  test:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      lock-artifact: candidate-lock

  release:
    needs: [resolve, test]
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-lock
      - name: Bump version, changelog, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t lines < <(sed 's/^/Dependencies: /' changes.txt)
          v=$(python3 .github/scripts/bump.py "${lines[@]}")
          rm changes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock VERSION CHANGELOG.md
          git commit -m "deps: update pinned dependencies (v$v)"
          git tag "v$v"
          git push origin HEAD:main "v$v"
          python3 .github/scripts/release_notes.py "$v" > notes.md
          gh release create "v$v" --title "l9s $v" --notes-file notes.md

  report-failure:
    needs: [resolve, test, release]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dependency update failed CI"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q .; then
            echo "issue already open"; exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
            --body "The weekly dependency refresh resolved newer versions, but CI failed on them, so nothing was released. Run: $RUN"

  vllm-watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Open an issue when a newer vLLM image is out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cur=$(grep -E '^NVIDIA_IMAGE' app/hw.py | sed -E 's/.*:(v[0-9.]+)".*/\1/')
          latest=$(curl -fsSL "https://hub.docker.com/v2/repositories/vllm/vllm-openai/tags?page_size=100&ordering=last_updated" \
            | python3 -c 'import json,re,sys; t=[r["name"] for r in json.load(sys.stdin)["results"] if re.fullmatch(r"v\d+\.\d+\.\d+",r["name"])]; print(max(t,key=lambda s:tuple(map(int,s[1:].split(".")))) if t else "")')
          echo "pinned $cur, latest $latest"
          [ -n "$latest" ] || exit 0
          newer=$(python3 -c "import sys; a,b=(tuple(map(int,x[1:].split('.'))) for x in sys.argv[1:]); print(b>a)" "$cur" "$latest")
          [ "$newer" = "True" ] || exit 0
          title="vLLM $latest is available (pinned: $cur)"
          if gh issue list -R "$GITHUB_REPOSITORY" --state all --search "in:title \"$title\"" --json number -q '.[0].number' | grep -q .; then
            echo "issue exists"; exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "vllm/vllm-openai:$latest is out. vLLM bumps are tested by hand on real GPUs before shipping: update NVIDIA_IMAGE in app/hw.py, run tests/live on a GPU box, then bump VERSION. Users can already run \`l9s upgrade\` themselves."
